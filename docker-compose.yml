services:
  nats:
    image: nats:latest
    command: ['-js', '-sd', '/data']
    ports:
      - '4222:4222'
    volumes:
      - ./data/nats:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --dir
      - /data
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
